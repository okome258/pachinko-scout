name: Update machines DB

on:
  schedule:
    - cron: "0 3 * * 1"  # 毎週月曜 12:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch machines from DMMぱちタウン
        run: python3 scripts/fetch_machines.py --detail-sleep 0.4

      - name: Commit updated machines.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add machines.json
          git diff --staged --quiet || git commit -m "chore: weekly machine spec update from DMM p-town"
          git push
