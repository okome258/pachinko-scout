<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/manifest.json" />
  <title>パチスカウト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; color: #fff; }

    #app { position: relative; width: 100%; height: 100%; }

    #video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .frame {
      position: absolute;
      inset: 12% 6% 28%;
      border: 3px solid rgba(56, 189, 248, 0.8);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    .frame::after {
      content: "データ画面をここに合わせる";
      position: absolute; bottom: -32px; left: 0; right: 0;
      text-align: center; font-size: 14px; color: #94a3b8;
    }

    #topBar {
      position: absolute; top: 0; left: 0; right: 0;
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      background: linear-gradient(#000c, transparent);
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10;
    }
    #topBar h1 { font-size: 18px; }
    .badge {
      background: #1e293b; padding: 4px 10px; border-radius: 20px;
      font-size: 13px; color: #94a3b8;
    }

    #bottomBar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 16px 16px max(24px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, #000e);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      z-index: 10;
    }

    #scanBtn {
      width: 76px; height: 76px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: #22c55e;
      box-shadow: 0 0 24px #22c55e88;
      cursor: pointer;
    }
    #scanBtn:disabled { background: #334155; box-shadow: none; }
    #scanBtn.scanning { animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.92); }
    }

    .sub-btns { display: flex; gap: 12px; width: 100%; }
    .sub-btns button {
      flex: 1; padding: 12px; border: 0; border-radius: 12px;
      background: #1e293b; color: #fff; font-size: 14px; font-weight: 600;
    }
    .sub-btns button.primary { background: #38bdf8; color: #0f172a; }

    #overlay {
      position: absolute; inset: 0; z-index: 20;
      background: #0f172af0;
      display: none; flex-direction: column;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      overflow-y: auto;
    }
    #overlay.show { display: flex; }

    .verdict { font-size: 42px; font-weight: 900; margin: 8px 0; }
    .verdict.ok { color: #22c55e; }
    .verdict.warn { color: #eab308; }
    .verdict.bad { color: #ef4444; }

    .machine { font-size: 22px; font-weight: 700; }
    ul { padding-left: 18px; margin: 12px 0; }
    li { margin-bottom: 6px; line-height: 1.4; }

    .session-item {
      background: #1e293b; border-radius: 10px; padding: 10px 12px;
      margin-bottom: 8px; display: flex; justify-content: space-between;
    }

    #setup {
      position: absolute; inset: 0; z-index: 30;
      background: #0f172a; padding: 24px;
      display: flex; flex-direction: column; justify-content: center; gap: 16px;
    }
    #setup.hide, .hide { display: none; }
    #setup input {
      width: 100%; padding: 14px; border-radius: 10px;
      border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 16px;
    }
    #setup button {
      padding: 16px; border: 0; border-radius: 12px;
      background: #22c55e; color: #052e16; font-size: 17px; font-weight: 700;
    }
    #setup p { color: #94a3b8; font-size: 14px; line-height: 1.5; }

    .loading {
      position: absolute; inset: 0; z-index: 15;
      background: #000a; display: none;
      align-items: center; justify-content: center;
      font-size: 20px; font-weight: 600;
    }
    .loading.show { display: flex; }
  </style>
</head>
<body>
  <div id="setup">
    <h1>パチスカウト</h1>
    <p>スマホだけで使えます。初回だけAPIのURLを入れてください（家で1回設定すればOK）。</p>
    <input id="apiUrl" type="url" placeholder="https://pachinko-scout.xxx.workers.dev" />
    <button id="saveSetup">使い始める</button>
    <p style="font-size:12px">Telegram版なら設定不要 → Botに写真を送るだけ</p>
  </div>

  <div id="app" class="hide">
    <video id="video" autoplay playsinline muted></video>
    <div class="frame"></div>

    <div id="topBar">
      <h1>スカウト</h1>
      <span class="badge" id="sessionCount">0台スキャン済</span>
    </div>

    <div class="loading" id="loading">解析中…</div>

    <div id="bottomBar">
      <button id="scanBtn" aria-label="スキャン"></button>
      <div class="sub-btns">
        <button id="compareBtn" class="primary" disabled>比較する</button>
        <button id="clearBtn">リセット</button>
      </div>
    </div>

    <div id="overlay">
      <div class="machine" id="oMachine"></div>
      <div class="verdict" id="oVerdict"></div>
      <ul id="oReasons"></ul>
      <p id="oStop" style="color:#94a3b8;font-size:14px;margin-top:8px"></p>
      <div id="sessionList" style="margin-top:16px"></div>
      <button id="closeOverlay" style="margin-top:auto;padding:16px;border:0;border-radius:12px;background:#38bdf8;color:#0f172a;font-size:17px;font-weight:700">次の台へ</button>
    </div>
  </div>

  <canvas id="canvas" style="display:none"></canvas>

  <script>
    const API_KEY = "pachinko_scout_api";
    let apiBase = localStorage.getItem(API_KEY) || window.location.origin;
    let stream = null;
    let session = [];

    const setup = document.getElementById("setup");
    const app = document.getElementById("app");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const scanBtn = document.getElementById("scanBtn");
    const loading = document.getElementById("loading");
    const overlay = document.getElementById("overlay");

    function getApiBase() {
      return apiBase.replace(/\/$/, "");
    }

    document.getElementById("saveSetup").onclick = () => {
      const v = document.getElementById("apiUrl").value.trim();
      if (!v) return alert("URLを入力してください");
      apiBase = v;
      localStorage.setItem(API_KEY, v);
      setup.classList.add("hide");
      app.classList.remove("hide");
      startCamera();
    };

    const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.protocol === "file:";
    if (!isLocal) {
      apiBase = window.location.origin;
      localStorage.setItem(API_KEY, apiBase);
    }
    if (!isLocal || localStorage.getItem(API_KEY)) {
      document.getElementById("apiUrl").value = apiBase;
      setup.classList.add("hide");
      app.classList.remove("hide");
      startCamera();
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 } },
          audio: false,
        });
        video.srcObject = stream;
      } catch (e) {
        alert("カメラを許可してください: " + e.message);
      }
    }

    function captureBase64() {
      const w = video.videoWidth;
      const h = video.videoHeight;
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(video, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      return dataUrl.split(",")[1];
    }

    function verdictClass(v) {
      if (v === "打つ候補") return "ok";
      if (v === "見送り") return "bad";
      return "warn";
    }

    function showResult(result) {
      const name = result.extracted?.machine_name || "不明";
      document.getElementById("oMachine").textContent = name;
      const ov = document.getElementById("oVerdict");
      ov.textContent = `${result.score}点 ${result.verdict}`;
      ov.className = "verdict " + verdictClass(result.verdict);
      document.getElementById("oReasons").innerHTML =
        (result.reasons || []).map((r) => `<li>${r}</li>`).join("");
      document.getElementById("oStop").textContent = "やめる条件: " + (result.stop_rule || "");
      renderSession();
      overlay.classList.add("show");
    }

    function renderSession() {
      document.getElementById("sessionCount").textContent = `${session.length}台スキャン済`;
      document.getElementById("compareBtn").disabled = session.length < 2;
      const list = document.getElementById("sessionList");
      if (session.length < 2) { list.innerHTML = ""; return; }
      const sorted = [...session].sort((a, b) => b.score - a.score);
      list.innerHTML = "<p style='margin-bottom:8px;font-weight:600'>比較ランキング</p>" +
        sorted.map((r, i) => `
          <div class="session-item">
            <span>#${i + 1} ${r.extracted?.machine_name || "?"}</span>
            <span class="${verdictClass(r.verdict)}">${r.score} ${r.verdict}</span>
          </div>`).join("");
    }

    scanBtn.onclick = async () => {
      if (!stream) return;
      scanBtn.disabled = true;
      scanBtn.classList.add("scanning");
      loading.classList.add("show");

      try {
        const image = captureBase64();
        const res = await fetch(getApiBase() + "/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image, mime: "image/jpeg" }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "失敗");
        session.push(data);
        showResult(data);
      } catch (e) {
        alert("エラー: " + e.message);
      } finally {
        loading.classList.remove("show");
        scanBtn.classList.remove("scanning");
        scanBtn.disabled = false;
      }
    };

    document.getElementById("closeOverlay").onclick = () => overlay.classList.remove("show");

    document.getElementById("compareBtn").onclick = () => {
      if (session.length < 2) return;
      const best = [...session].sort((a, b) => b.score - a.score)[0];
      showResult(best);
    };

    document.getElementById("clearBtn").onclick = () => {
      session = [];
      renderSession();
    };
  </script>
</body>
</html>
