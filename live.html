<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/manifest.json" />
  <title>パチスカウト Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }

    #video {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* 透かしオーバーレイ */
    #hud {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .frame {
      position: absolute;
      inset: 5% 4% 18%;
      border: 3px solid var(--frame-color, #38bdf8);
      border-radius: 8px;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.2);
      transition: border-color 0.3s;
    }
    .frame-hint {
      position: absolute;
      bottom: calc(18% + 6px);
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      text-shadow: 0 1px 3px #000;
    }

    #verdictPanel {
      position: fixed;
      bottom: max(148px, calc(128px + env(safe-area-inset-bottom)));
      top: auto;
      left: 12px; right: 12px;
      padding: 10px 14px 12px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: auto;
      max-height: 38vh;
      overflow-y: auto;
      z-index: 8;
    }
    #verdictPanel.show { opacity: 1; transform: translateY(0); }
    #verdictPanel.compact #evBox,
    #verdictPanel.compact #retreatBox,
    #verdictPanel.compact #verdictReasons { display: none; }
    .scan-block {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .scan-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .scan-block-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .scan-block-edit {
      flex: 0 0 auto;
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 6px;
      border: 0;
      background: rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
      font-weight: 700;
      cursor: pointer;
    }
    .scan-block-value {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.35;
    }
    .scan-block-meta {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.4;
    }
    .scan-block-editor {
      display: none;
      margin-top: 8px;
      flex-direction: column;
      gap: 6px;
    }
    .scan-block-editor.show { display: flex; }
    .scan-block-editor select,
    .scan-block-editor input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 13px;
    }
    .scan-block-editor label {
      font-size: 11px;
      color: #94a3b8;
    }
    #machineBlock.hit .scan-block-value { color: #4ade80; }
    #machineBlock.warn .scan-block-value { color: #fbbf24; }
    #machineBlock.none .scan-block-value { color: #f87171; }
    #panelActions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    #panelActions button {
      flex: 1;
      padding: 8px 6px;
      font-size: 12px;
      border-radius: 8px;
      border: 0;
      font-weight: 700;
      cursor: pointer;
    }
    #panelDetailBtn { background: rgba(56,189,248,0.85); color: #0f172a; }
    #panelCloseBtn { background: rgba(71,85,105,0.9); color: #e2e8f0; }

    #machineNameBadge {
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 800;
      margin-bottom: 6px;
      color: #e2e8f0;
    }
    #machineNameBadge.none { color: #f87171; }
    #machineNameBadge.hit { color: #4ade80; }
    #machineNameBadge.ocr { color: #fbbf24; }
    #machineStatus {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    #verdictMain {
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 900;
      line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    #verdictSub {
      font-size: 14px;
      color: #cbd5e1;
      margin-top: 6px;
      line-height: 1.4;
    }
    #verdictReasons {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 8px;
    }
    #retreatBox {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: #fecaca;
    }
    #retreatBox .retreat-title {
      font-weight: 800;
      font-size: 15px;
      color: #fca5a5;
      margin-bottom: 4px;
    }
    #feedbackRow {
      position: fixed;
      bottom: max(88px, calc(72px + env(safe-area-inset-bottom)));
      left: 12px; right: 12px;
      display: none;
      gap: 8px;
      z-index: 9;
      pointer-events: auto;
    }
    #feedbackRow.show { display: flex; }
    #feedbackRow button {
      flex: 1;
      padding: 10px 8px;
      font-size: 13px;
      border-radius: 10px;
      border: 0;
      font-weight: 700;
    }
    #fbWin { background: rgba(34,197,94,0.9); color: #052e16; }
    #fbLose { background: rgba(239,68,68,0.9); color: #fff; }
    #evBox {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: #bae6fd;
    }
    #evBox .ev-title { font-weight: 800; font-size: 15px; color: #7dd3fc; }
    #machinePanel {
      position: fixed;
      bottom: max(150px, calc(130px + env(safe-area-inset-bottom)));
      left: 12px; right: 12px;
      z-index: 11;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      max-height: 45vh;
      overflow-y: auto;
    }
    #machinePanel.show { display: flex; }
    #machinePanel label { font-size: 12px; color: #94a3b8; }
    #machinePanel select, #machinePanel input {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 14px;
    }
    #machinePanel .row { display: flex; gap: 8px; }
    #machinePanel .row label { display: flex; align-items: center; gap: 6px; color: #e2e8f0; }
    #machinePanel button.save-custom {
      background: #38bdf8; color: #0f172a; font-weight: 700; padding: 10px;
    }
    #pickMachineBtn {
      background: rgba(56, 189, 248, 0.85) !important;
      color: #0f172a !important;
      flex: 0.8 !important;
    }

    #statusBar {
      position: fixed;
      bottom: max(100px, calc(80px + env(safe-area-inset-bottom)));
      left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      z-index: 6;
      text-shadow: 0 1px 4px #000;
    }

    #controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 12px 16px max(20px, env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      z-index: 10;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 16px 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    #holdBtn {
      flex: 2;
      background: rgba(34, 197, 94, 0.85);
      color: #052e16;
      touch-action: none;
    }
    #holdBtn.active { background: #16a34a; transform: scale(0.98); }
    #autoBtn {
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
    }
    #autoBtn.on { background: rgba(56, 189, 248, 0.9); color: #0f172a; }

    /* 横持ち：データ画面が横長なので枠を広げ、結果は右サイドに */
    @media (orientation: landscape) {
      #video { object-fit: contain; background: #000; }
      .frame { inset: 5% 38% 10% 2%; }
      .frame-hint {
        bottom: calc(10% + 4px);
        left: 2%;
        right: 38%;
        font-size: 10px;
      }
      #verdictPanel {
        top: auto;
        bottom: max(64px, calc(52px + env(safe-area-inset-bottom)));
        left: auto;
        right: max(8px, env(safe-area-inset-right));
        width: min(36vw, 340px);
        max-height: 55vh;
        overflow-y: auto;
        padding: 10px 12px;
      }
      #verdictMain { font-size: clamp(22px, 4vw, 32px); }
      #feedbackRow {
        left: auto;
        right: max(8px, env(safe-area-inset-right));
        width: min(36vw, 340px);
        bottom: max(64px, calc(52px + env(safe-area-inset-bottom)));
      }
      #statusBar {
        left: 12px;
        right: auto;
        width: 55%;
        text-align: left;
        bottom: max(64px, calc(52px + env(safe-area-inset-bottom)));
      }
      #machinePanel {
        left: auto;
        right: max(8px, env(safe-area-inset-right));
        width: min(36vw, 340px);
        bottom: max(64px, calc(52px + env(safe-area-inset-bottom)));
        max-height: 70vh;
      }
    }

    #startScreen {
      position: fixed; inset: 0; z-index: 20;
      background: #0f172a;
      color: #f1f5f9;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }
    #startScreen.hide { display: none; }
    #startScreen h1 { font-size: 22px; }
    #startScreen p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
    #startScreen button {
      background: #22c55e;
      color: #052e16;
      font-size: 17px;
    }
    .tag {
      display: inline-block;
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-right: 6px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <h1>パチスカウト Live</h1>
    <p>
      <span class="tag">写真保存なし</span>
      <span class="tag">無料</span>
      <span class="tag">端末内のみ</span>
    </p>
    <p>
      データ画面にかざすと、透かしで判定が出ます。<br>
      撮影ボタンは使いません。カメラ映像も端末外に送りません。
    </p>
    <p style="font-size:12px">※初回だけ文字認識データ（約10MB）を読み込みます</p>
    <button id="startBtn">カメラを起動</button>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" hidden></canvas>

  <div id="hud">
    <div class="frame" id="frame"></div>
    <div class="frame-hint">枠内にデータ画面を合わせる（縦・横どちらでもOK）</div>
    <div id="verdictPanel">
      <div id="verdictMain">—</div>
      <div id="verdictSub"></div>

      <div class="scan-block" id="machineBlock">
        <div class="scan-block-head">
          <span class="scan-block-title">機種情報</span>
          <button type="button" class="scan-block-edit" id="machineBlockEdit">変更</button>
        </div>
        <div class="scan-block-value" id="machineBlockValue">未設定</div>
        <div class="scan-block-meta" id="machineBlockMeta">—</div>
        <div class="scan-block-editor" id="machineBlockEditor">
          <label for="scanMachineSelect">機種（スペック・期待値に使用）</label>
          <select id="scanMachineSelect"></select>
        </div>
      </div>

      <div class="scan-block" id="dataBlock">
        <div class="scan-block-head">
          <span class="scan-block-title">台データ</span>
          <button type="button" class="scan-block-edit" id="dataBlockEdit">編集</button>
        </div>
        <div class="scan-block-value" id="dataBlockValue">—</div>
        <div class="scan-block-meta" id="dataBlockMeta">カウンター読み取り</div>
        <div class="scan-block-editor" id="dataEditForm">
          <label>現在回転</label>
          <input id="editSpins" type="number" inputmode="numeric" placeholder="例: 182" />
          <label>本日初当り</label>
          <input id="editFirstHits" type="number" inputmode="numeric" placeholder="例: 3" />
          <label>本日大当り</label>
          <input id="editBigHits" type="number" inputmode="numeric" placeholder="例: 3" />
          <label>LT（例: 0/3）</label>
          <input id="editLt" type="text" placeholder="0/3" />
          <label>最高出玉</label>
          <input id="editMaxPay" type="number" inputmode="numeric" placeholder="例: 180" />
          <label>実績初当り（例: 1/182）</label>
          <input id="editProb" type="text" placeholder="1/182" />
          <button type="button" class="scan-block-edit" id="dataApplyBtn" style="margin-top:4px">反映</button>
        </div>
      </div>

      <div id="verdictReasons"></div>
      <div id="evBox" hidden>
        <div class="ev-title" id="evSummary"></div>
        <div id="evLines"></div>
      </div>
      <div id="retreatBox" hidden>
        <div class="retreat-title" id="retreatSummary"></div>
        <div id="retreatLines"></div>
      </div>
      <div id="panelActions">
        <button type="button" id="panelDetailBtn">詳細</button>
        <button type="button" id="panelCloseBtn">閉じる</button>
      </div>
    </div>
  </div>

  <div id="machinePanel">
    <label>デフォルト機種（毎回の初期値）</label>
    <select id="machineSelect"></select>
    <details>
      <summary style="color:#94a3b8;font-size:13px;cursor:pointer">＋ カスタム機種を登録</summary>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:8px">
        <input id="customName" placeholder="機種名（例: 新世紀エヴァ）" />
        <div class="row">
          <input id="customDenom" type="number" placeholder="初当り 1/319 → 319" />
          <input id="customCeiling" type="number" placeholder="天井 840" />
        </div>
        <label><input type="checkbox" id="customLt" checked /> LT重要機種</label>
        <button type="button" class="save-custom" id="saveCustomBtn">登録して選択</button>
      </div>
    </details>
  </div>

  <div id="feedbackRow">
    <button id="fbWin">当たった</button>
    <button id="fbLose">外れた</button>
    <button id="fbSkip">スキップ</button>
  </div>

  <div id="statusBar">画面に合わせて長押し</div>

  <div id="controls">
    <button id="pickMachineBtn">機種</button>
    <button id="autoBtn">自動: OFF</button>
    <button id="holdBtn">かざして長押し</button>
  </div>

  <script type="module">
    import { parseOcrText } from "./parser.js";
    import { scoreMachine, verdictColor } from "./score.js";
    import { loadMachines, matchMachine, detectCounterType, getMachineNameFeedback } from "./machines.js";
    import { calcRetreatPlan } from "./retreat.js";
    import { applyLearnedBias, recordFeedback } from "./learn.js";
    import { calcExpectedValue } from "./ev.js";
    import {
      getAllMachineOptions,
      getSelectedMachineId,
      setSelectedMachineId,
      resolveMachineSpecSync,
      saveCustomMachine,
    } from "./machine-picker.js";
    import {
      formatCounterSummary,
      formatMachineSummary,
      applyDataOverrides,
      suggestMachineIdFromOcr,
      mergeCounterData,
    } from "./scan-session.js";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const frame = document.getElementById("frame");
    const panel = document.getElementById("verdictPanel");
    const statusBar = document.getElementById("statusBar");
    const holdBtn = document.getElementById("holdBtn");
    const autoBtn = document.getElementById("autoBtn");

    let stream = null;
    let ocrWorker = null;
    let machineDb = null;
    let scanning = false;
    let autoMode = false;
    let autoTimer = null;
    let lastScanAt = 0;

    let lastEntry = null;
    let panelHideTimer = null;
    let panelExpanded = false;
    const PANEL_AUTO_HIDE_MS = 6000;

    const feedbackRow = document.getElementById("feedbackRow");
    const panelDetailBtn = document.getElementById("panelDetailBtn");
    const panelCloseBtn = document.getElementById("panelCloseBtn");
    const SCAN_COOLDOWN_MS = 2500;

    const machineSelect = document.getElementById("machineSelect");
    const machinePanel = document.getElementById("machinePanel");
    const scanMachineSelect = document.getElementById("scanMachineSelect");
    const machineBlock = document.getElementById("machineBlock");
    const machineBlockValue = document.getElementById("machineBlockValue");
    const machineBlockMeta = document.getElementById("machineBlockMeta");
    const machineBlockEditor = document.getElementById("machineBlockEditor");
    const dataBlockValue = document.getElementById("dataBlockValue");
    const dataBlockMeta = document.getElementById("dataBlockMeta");
    const dataEditForm = document.getElementById("dataEditForm");

    let scanSession = {
      rawOcr: null,
      ocrData: null,
      dataOverrides: {},
      scanMachineId: "auto",
      ocrMachineName: null,
      confidence: null,
    };

    function fillMachineSelectOptions(selectEl, includeAuto = true) {
      selectEl.innerHTML = includeAuto
        ? '<option value="auto">自動（OCRで推定）</option>'
        : "";
      for (const m of getAllMachineOptions(machineDb)) {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = `${m.names[0]}（1/${m.first_hit_denom || "?"}）`;
        selectEl.appendChild(opt);
      }
    }

    function populateMachineSelect() {
      fillMachineSelectOptions(machineSelect, true);
      machineSelect.value = getSelectedMachineId();
      fillMachineSelectOptions(scanMachineSelect, true);
    }

    function getEffectiveCounterData() {
      return mergeCounterData(scanSession.ocrData, scanSession.dataOverrides);
    }

    function getEffectiveMachineId() {
      return scanSession.scanMachineId || "auto";
    }

    function resolveSpecForSession(data) {
      const machineId = getEffectiveMachineId();
      return resolveMachineSpecSync(data, machineDb, machineId, matchMachine);
    }

    function updateMachineBlock(spec) {
      const machineId = getEffectiveMachineId();
      const { title, meta } = formatMachineSummary(
        spec,
        scanSession.ocrMachineName,
        machineId,
      );
      machineBlockValue.textContent = title;
      machineBlockMeta.textContent = meta;
      machineBlock.className = "scan-block";
      if (machineId !== "auto" || spec?.match_source === "name" || spec?.match_source === "keyword") {
        machineBlock.classList.add("hit");
      } else if (scanSession.ocrMachineName) {
        machineBlock.classList.add("warn");
      } else {
        machineBlock.classList.add("none");
      }
      if (scanMachineSelect.value !== machineId) scanMachineSelect.value = machineId;
    }

    function updateDataBlock(data, confidence) {
      dataBlockValue.textContent = formatCounterSummary(data);
      dataBlockMeta.textContent =
        confidence === "low"
          ? "読み取り不完全 — 編集で修正可"
          : Object.keys(scanSession.dataOverrides).length
            ? "手動修正あり"
            : "カウンター読み取り";
    }

    function fillDataEditForm(data) {
      document.getElementById("editSpins").value = data.current_spins ?? "";
      document.getElementById("editFirstHits").value = data.today_first_hits ?? "";
      document.getElementById("editBigHits").value = data.today_big_hits ?? "";
      document.getElementById("editLt").value = data.lt_success ?? "";
      document.getElementById("editMaxPay").value = data.today_max_payout ?? "";
      document.getElementById("editProb").value =
        data.first_hit_probability?.replace(/^1\s*\/\s*/, "") ?? "";
    }

    function recalculateFromSession() {
      if (!scanSession.ocrData || !machineDb) return;
      const data = getEffectiveCounterData();
      const counterType = detectCounterType(scanSession.rawOcr || "", machineDb);
      const machineId = getEffectiveMachineId();
      const machineSpec = resolveSpecForSession(data);
      let result = scoreMachine(data, machineSpec);
      const bias = applyLearnedBias(
        result.score,
        machineSpec?.names?.[0],
        counterType?.id,
      );
      if (bias.biasApplied) {
        result = { ...result, score: bias.score };
        if (bias.score >= 65) result.verdict = "打つ候補";
        else if (bias.score < 45) result.verdict = "見送り";
        else result.verdict = "様子見";
        result.biasApplied = bias.biasApplied;
      }
      const ev = calcExpectedValue(data, machineSpec);
      const retreat = calcRetreatPlan(data, machineSpec);
      const nameFeedback = getMachineNameFeedback(
        scanSession.ocrMachineName,
        machineDb,
        machineSpec,
        machineId,
      );
      lastEntry = {
        machine: machineSpec?.names?.[0],
        counter: counterType?.id,
        score: result.score,
        verdict: result.verdict,
        spins: data.current_spins,
        ev: ev.ev,
      };
      showResult(
        result,
        scanSession.confidence,
        machineSpec,
        counterType,
        data,
        retreat,
        ev,
        nameFeedback,
      );
    }

    document.getElementById("startBtn").onclick = async () => {
      document.getElementById("startScreen").classList.add("hide");
      statusBar.textContent = "機種データ取得中…";
      machineDb = await loadMachines(window.location.origin);
      populateMachineSelect();
      await startCamera();
      statusBar.textContent = `準備OK — 機種選択 or 長押し`;
    };

    machineSelect.onchange = () => {
      setSelectedMachineId(machineSelect.value);
      statusBar.textContent =
        machineSelect.value === "auto"
          ? "次回スキャンの機種はOCR推定"
          : `次回の初期機種: ${machineSelect.selectedOptions[0].textContent}`;
    };

    scanMachineSelect.onchange = () => {
      scanSession.scanMachineId = scanMachineSelect.value;
      recalculateFromSession();
    };

    document.getElementById("machineBlockEdit").onclick = () => {
      machineBlockEditor.classList.toggle("show");
      schedulePanelHide();
    };

    document.getElementById("dataBlockEdit").onclick = () => {
      fillDataEditForm(getEffectiveCounterData());
      dataEditForm.classList.toggle("show");
      schedulePanelHide();
    };

    document.getElementById("dataApplyBtn").onclick = () => {
      scanSession.dataOverrides = applyDataOverrides(scanSession.ocrData, {
        current_spins: document.getElementById("editSpins").value,
        today_first_hits: document.getElementById("editFirstHits").value,
        today_big_hits: document.getElementById("editBigHits").value,
        lt_success: document.getElementById("editLt").value,
        today_max_payout: document.getElementById("editMaxPay").value,
        first_hit_probability: document.getElementById("editProb").value,
      });
      dataEditForm.classList.remove("show");
      recalculateFromSession();
    };

    document.getElementById("pickMachineBtn").onclick = () => {
      machinePanel.classList.toggle("show");
    };

    document.getElementById("saveCustomBtn").onclick = () => {
      const name = document.getElementById("customName").value.trim();
      if (!name) return alert("機種名を入力");
      const entry = saveCustomMachine({
        name,
        first_hit_denom: document.getElementById("customDenom").value || 319,
        ceiling_spins: document.getElementById("customCeiling").value || 840,
        lt_critical: document.getElementById("customLt").checked,
      });
      populateMachineSelect();
      machineSelect.value = entry.id;
      setSelectedMachineId(entry.id);
      machinePanel.classList.remove("show");
      statusBar.textContent = `登録: ${name}`;
    };

    async function startCamera() {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
    }

    async function ensureOcr() {
      if (ocrWorker) return ocrWorker;
      statusBar.textContent = "初回読み込み中…（10MB・1回だけ）";
      const Tesseract = (await import("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js")).default;
      ocrWorker = await Tesseract.createWorker("jpn", 1, {
        logger: () => {},
      });
      statusBar.textContent = "準備OK";
      return ocrWorker;
    }

    function getCropCanvas(inset = { top: 0, height: 1 }) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      const rect = frame.getBoundingClientRect();
      const vr = video.getBoundingClientRect();
      const scaleX = vw / vr.width;
      const scaleY = vh / vr.height;

      let sx = (rect.left - vr.left) * scaleX;
      let sy = (rect.top - vr.top) * scaleY;
      let sw = rect.width * scaleX;
      let sh = rect.height * scaleY;

      if (inset.height < 1) {
        sh = sh * inset.height;
        sy = sy + (rect.height * scaleY) * inset.top;
      }

      const maxW = inset.height < 1 ? 360 : 480;
      const scale = Math.min(1, maxW / sw);
      canvas.width = Math.round(sw * scale);
      canvas.height = Math.round(sh * scale);

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      return canvas;
    }

    function hideResultPanel() {
      clearTimeout(panelHideTimer);
      panel.classList.remove("show");
      panel.classList.add("compact");
      panelExpanded = false;
      panelDetailBtn.textContent = "詳細";
      feedbackRow.classList.remove("show");
    }

    function schedulePanelHide() {
      clearTimeout(panelHideTimer);
      panelHideTimer = setTimeout(hideResultPanel, PANEL_AUTO_HIDE_MS);
    }

    panelDetailBtn.onclick = () => {
      panelExpanded = !panelExpanded;
      panel.classList.toggle("compact", !panelExpanded);
      panelDetailBtn.textContent = panelExpanded ? "簡易" : "詳細";
      schedulePanelHide();
    };
    panelCloseBtn.onclick = () => hideResultPanel();

    function showResult(result, confidence, machineSpec, counterType, data, retreat, ev) {
      const color = verdictColor(result.verdict);
      frame.style.setProperty("--frame-color", color);

      updateMachineBlock(machineSpec);
      updateDataBlock(data, confidence);

      document.getElementById("verdictMain").textContent = `${result.score}点 ${result.verdict}`;
      document.getElementById("verdictMain").style.color = color;

      let sub = "";
      if (machineSpec?.first_hit_denom) sub += `1/${Math.round(machineSpec.first_hit_denom)}`;
      if (ev) sub += ` / ${ev.summary}`;
      if (result.biasApplied) sub += ` / 学習${result.biasApplied > 0 ? "+" : ""}${result.biasApplied}`;
      if (confidence === "low") sub += " ※読み取り不完全";
      document.getElementById("verdictSub").textContent = sub || "—";
      document.getElementById("verdictReasons").textContent = result.reasons.slice(0, 3).join(" / ");

      const evBox = document.getElementById("evBox");
      if (ev) {
        evBox.hidden = false;
        document.getElementById("evSummary").textContent = ev.summary;
        document.getElementById("evLines").innerHTML = [
          `${ev.mode_label || "—"}: 1/${ev.spec_used.denom} 天井${ev.spec_used.ceiling}${ev.spec_used.lt_critical ? " LT重要" : ""}${ev.spec_used.entry_rate != null ? ` 突入${Math.round(ev.spec_used.entry_rate * 100)}%` : ""}`,
          ...ev.factors,
          ev.retreat_hint,
        ].map((l) => `<div>${l}</div>`).join("");
      } else {
        evBox.hidden = true;
      }

      const rb = document.getElementById("retreatBox");
      if (retreat) {
        rb.hidden = false;
        document.getElementById("retreatSummary").textContent = retreat.summary;
        document.getElementById("retreatLines").innerHTML = retreat.lines
          .map((l) => `<div>${l}</div>`)
          .join("");
      } else {
        rb.hidden = true;
      }

      panel.classList.add("show", "compact");
      panelExpanded = false;
      panelDetailBtn.textContent = "詳細";
      feedbackRow.classList.add("show");
      schedulePanelHide();
    }

    async function scanOnce() {
      const now = Date.now();
      if (scanning || now - lastScanAt < SCAN_COOLDOWN_MS) return;
      scanning = true;
      lastScanAt = now;
      statusBar.textContent = "読み取り中…";

      try {
        const crop = getCropCanvas();
        if (!crop) throw new Error("カメラ未準備");

        const worker = await ensureOcr();
        const topCrop = getCropCanvas({ top: 0, height: 0.22 });
        const mainResult = await worker.recognize(crop);
        let text = mainResult.data.text;
        if (topCrop) {
          const topResult = await worker.recognize(topCrop);
          text = `${topResult.data.text}\n${text}`;
        }
        const { data, confidence } = parseOcrText(text);

        if (confidence === "none") {
          statusBar.textContent = "数字が読めません — 下の履歴バーまで枠に入れて";
          panel.classList.remove("show");
          return;
        }

        if (!machineDb) machineDb = await loadMachines(window.location.origin);

        scanSession = {
          rawOcr: text,
          ocrData: { ...data, ocr_raw: text },
          dataOverrides: {},
          ocrMachineName: data.machine_name,
          confidence,
          scanMachineId: suggestMachineIdFromOcr({ ...data, ocr_raw: text }, machineDb, matchMachine),
        };

        const sticky = getSelectedMachineId();
        if (sticky !== "auto") {
          scanSession.scanMachineId = sticky;
        }

        scanMachineSelect.value = scanSession.scanMachineId;
        machineBlockEditor.classList.remove("show");
        dataEditForm.classList.remove("show");
        recalculateFromSession();
        statusBar.textContent = "機種・台データを確認（それぞれ変更可）";
      } catch (e) {
        statusBar.textContent = "エラー: " + e.message;
      } finally {
        scanning = false;
      }
    }

    function bindHold(el) {
      const start = (e) => {
        e.preventDefault();
        el.classList.add("active");
        scanOnce();
      };
      const end = () => el.classList.remove("active");
      el.addEventListener("touchstart", start, { passive: false });
      el.addEventListener("touchend", end);
      el.addEventListener("mousedown", start);
      el.addEventListener("mouseup", end);
      el.addEventListener("mouseleave", end);
    }
    bindHold(holdBtn);

    function onFeedback(outcome) {
      if (!lastEntry) return;
      recordFeedback(lastEntry, outcome);
      hideResultPanel();
      statusBar.textContent =
        outcome === "win"
          ? "記録: 当たった → 次回から補正"
          : outcome === "lose"
            ? "記録: 外れた → 次回から補正"
            : "スキップ";
      lastEntry = null;
    }
    document.getElementById("fbWin").onclick = () => onFeedback("win");
    document.getElementById("fbLose").onclick = () => onFeedback("lose");
    document.getElementById("fbSkip").onclick = () => onFeedback("skip");

    autoBtn.onclick = () => {
      autoMode = !autoMode;
      autoBtn.textContent = `自動: ${autoMode ? "ON" : "OFF"}`;
      autoBtn.classList.toggle("on", autoMode);
      if (autoMode) {
        autoTimer = setInterval(scanOnce, 4000);
        statusBar.textContent = "自動スキャン中（4秒間隔）";
      } else {
        clearInterval(autoTimer);
        statusBar.textContent = "手動モード";
      }
    };

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoMode = false;
        autoBtn.textContent = "自動: OFF";
        autoBtn.classList.remove("on");
      }
    });
  </script>
</body>
</html>
