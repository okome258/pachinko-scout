<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/manifest.json" />
  <title>パチスカウト Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }

    #video {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* 透かしオーバーレイ */
    #hud {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .frame {
      position: absolute;
      inset: 12% 4% 18%;
      border: 3px solid var(--frame-color, #38bdf8);
      border-radius: 8px;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.2);
      transition: border-color 0.3s;
    }
    .frame-hint {
      position: absolute;
      bottom: calc(18% + 6px);
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      text-shadow: 0 1px 3px #000;
    }

    #verdictPanel {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 12px; right: 12px;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.25s, transform 0.25s;
    }
    #verdictPanel.show { opacity: 1; transform: translateY(0); }

    #machineNameBadge {
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 800;
      margin-bottom: 6px;
      color: #e2e8f0;
    }
    #machineNameBadge.none { color: #f87171; }
    #machineNameBadge.hit { color: #4ade80; }
    #machineNameBadge.ocr { color: #fbbf24; }
    #machineStatus {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    #verdictMain {
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 900;
      line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    #verdictSub {
      font-size: 14px;
      color: #cbd5e1;
      margin-top: 6px;
      line-height: 1.4;
    }
    #verdictReasons {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 8px;
    }
    #retreatBox {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: #fecaca;
    }
    #retreatBox .retreat-title {
      font-weight: 800;
      font-size: 15px;
      color: #fca5a5;
      margin-bottom: 4px;
    }
    #feedbackRow {
      position: fixed;
      bottom: max(88px, calc(72px + env(safe-area-inset-bottom)));
      left: 12px; right: 12px;
      display: none;
      gap: 8px;
      z-index: 9;
    }
    #feedbackRow.show { display: flex; }
    #feedbackRow button {
      flex: 1;
      padding: 10px 8px;
      font-size: 13px;
      border-radius: 10px;
      border: 0;
      font-weight: 700;
    }
    #fbWin { background: rgba(34,197,94,0.9); color: #052e16; }
    #fbLose { background: rgba(239,68,68,0.9); color: #fff; }
    #evBox {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: #bae6fd;
    }
    #evBox .ev-title { font-weight: 800; font-size: 15px; color: #7dd3fc; }
    #machinePanel {
      position: fixed;
      bottom: max(150px, calc(130px + env(safe-area-inset-bottom)));
      left: 12px; right: 12px;
      z-index: 11;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      max-height: 45vh;
      overflow-y: auto;
    }
    #machinePanel.show { display: flex; }
    #machinePanel label { font-size: 12px; color: #94a3b8; }
    #machinePanel select, #machinePanel input {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 14px;
    }
    #machinePanel .row { display: flex; gap: 8px; }
    #machinePanel .row label { display: flex; align-items: center; gap: 6px; color: #e2e8f0; }
    #machinePanel button.save-custom {
      background: #38bdf8; color: #0f172a; font-weight: 700; padding: 10px;
    }
    #pickMachineBtn {
      background: rgba(56, 189, 248, 0.85) !important;
      color: #0f172a !important;
      flex: 0.8 !important;
    }

    #statusBar {
      position: fixed;
      bottom: max(100px, calc(80px + env(safe-area-inset-bottom)));
      left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      z-index: 6;
      text-shadow: 0 1px 4px #000;
    }

    #controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 12px 16px max(20px, env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      z-index: 10;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 16px 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    #holdBtn {
      flex: 2;
      background: rgba(34, 197, 94, 0.85);
      color: #052e16;
      touch-action: none;
    }
    #holdBtn.active { background: #16a34a; transform: scale(0.98); }
    #autoBtn {
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
    }
    #autoBtn.on { background: rgba(56, 189, 248, 0.9); color: #0f172a; }

    /* 横持ち：データ画面が横長なので枠を広げ、結果は右サイドに */
    @media (orientation: landscape) {
      #video { object-fit: contain; background: #000; }
      .frame { inset: 5% 38% 10% 2%; }
      .frame-hint {
        bottom: calc(10% + 4px);
        left: 2%;
        right: 38%;
        font-size: 10px;
      }
      #verdictPanel {
        top: max(8px, env(safe-area-inset-top));
        left: auto;
        right: max(8px, env(safe-area-inset-right));
        width: min(36vw, 340px);
        max-height: calc(100vh - 80px);
        overflow-y: auto;
        padding: 10px 12px;
      }
      #verdictMain { font-size: clamp(22px, 4vw, 32px); }
      #feedbackRow {
        left: auto;
        right: max(8px, env(safe-area-inset-right));
        width: min(36vw, 340px);
        bottom: max(64px, calc(52px + env(safe-area-inset-bottom)));
      }
      #statusBar {
        left: 12px;
        right: auto;
        width: 55%;
        text-align: left;
        bottom: max(64px, calc(52px + env(safe-area-inset-bottom)));
      }
      #machinePanel {
        left: auto;
        right: max(8px, env(safe-area-inset-right));
        width: min(36vw, 340px);
        bottom: max(64px, calc(52px + env(safe-area-inset-bottom)));
        max-height: 70vh;
      }
    }

    #startScreen {
      position: fixed; inset: 0; z-index: 20;
      background: #0f172a;
      color: #f1f5f9;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }
    #startScreen.hide { display: none; }
    #startScreen h1 { font-size: 22px; }
    #startScreen p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
    #startScreen button {
      background: #22c55e;
      color: #052e16;
      font-size: 17px;
    }
    .tag {
      display: inline-block;
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-right: 6px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <h1>パチスカウト Live</h1>
    <p>
      <span class="tag">写真保存なし</span>
      <span class="tag">無料</span>
      <span class="tag">端末内のみ</span>
    </p>
    <p>
      データ画面にかざすと、透かしで判定が出ます。<br>
      撮影ボタンは使いません。カメラ映像も端末外に送りません。
    </p>
    <p style="font-size:12px">※初回だけ文字認識データ（約10MB）を読み込みます</p>
    <button id="startBtn">カメラを起動</button>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" hidden></canvas>

  <div id="hud">
    <div class="frame" id="frame"></div>
    <div class="frame-hint">枠内にデータ画面を合わせる（縦・横どちらでもOK）</div>
    <div id="verdictPanel">
      <div id="machineNameBadge"></div>
      <div id="machineStatus"></div>
      <div id="verdictMain">—</div>
      <div id="verdictSub"></div>
      <div id="verdictReasons"></div>
      <div id="evBox" hidden>
        <div class="ev-title" id="evSummary"></div>
        <div id="evLines"></div>
      </div>
      <div id="retreatBox" hidden>
        <div class="retreat-title" id="retreatSummary"></div>
        <div id="retreatLines"></div>
      </div>
    </div>
  </div>

  <div id="machinePanel">
    <label>機種選択（OCRより優先）</label>
    <select id="machineSelect"></select>
    <details>
      <summary style="color:#94a3b8;font-size:13px;cursor:pointer">＋ カスタム機種を登録</summary>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:8px">
        <input id="customName" placeholder="機種名（例: 新世紀エヴァ）" />
        <div class="row">
          <input id="customDenom" type="number" placeholder="初当り 1/319 → 319" />
          <input id="customCeiling" type="number" placeholder="天井 840" />
        </div>
        <label><input type="checkbox" id="customLt" checked /> LT重要機種</label>
        <button type="button" class="save-custom" id="saveCustomBtn">登録して選択</button>
      </div>
    </details>
  </div>

  <div id="feedbackRow">
    <button id="fbWin">当たった</button>
    <button id="fbLose">外れた</button>
    <button id="fbSkip">スキップ</button>
  </div>

  <div id="statusBar">画面に合わせて長押し</div>

  <div id="controls">
    <button id="pickMachineBtn">機種</button>
    <button id="autoBtn">自動: OFF</button>
    <button id="holdBtn">かざして長押し</button>
  </div>

  <script type="module">
    import { parseOcrText } from "./parser.js";
    import { scoreMachine, verdictColor } from "./score.js";
    import { loadMachines, matchMachine, detectCounterType, getMachineNameFeedback } from "./machines.js";
    import { calcRetreatPlan } from "./retreat.js";
    import { applyLearnedBias, recordFeedback } from "./learn.js";
    import { calcExpectedValue } from "./ev.js";
    import {
      getAllMachineOptions,
      getSelectedMachineId,
      setSelectedMachineId,
      resolveMachineSpecSync,
      saveCustomMachine,
    } from "./machine-picker.js";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const frame = document.getElementById("frame");
    const panel = document.getElementById("verdictPanel");
    const statusBar = document.getElementById("statusBar");
    const holdBtn = document.getElementById("holdBtn");
    const autoBtn = document.getElementById("autoBtn");

    let stream = null;
    let ocrWorker = null;
    let machineDb = null;
    let scanning = false;
    let autoMode = false;
    let autoTimer = null;
    let lastScanAt = 0;

    let lastEntry = null;

    const feedbackRow = document.getElementById("feedbackRow");
    const SCAN_COOLDOWN_MS = 2500;

    const machineSelect = document.getElementById("machineSelect");
    const machinePanel = document.getElementById("machinePanel");

    function populateMachineSelect() {
      machineSelect.innerHTML = '<option value="auto">自動（OCRで判定）</option>';
      for (const m of getAllMachineOptions(machineDb)) {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = `${m.names[0]}（1/${m.first_hit_denom || "?"} 天井${m.ceiling_spins || "?"})`;
        machineSelect.appendChild(opt);
      }
      machineSelect.value = getSelectedMachineId();
    }

    document.getElementById("startBtn").onclick = async () => {
      document.getElementById("startScreen").classList.add("hide");
      statusBar.textContent = "機種データ取得中…";
      machineDb = await loadMachines(window.location.origin);
      populateMachineSelect();
      await startCamera();
      statusBar.textContent = `準備OK — 機種選択 or 長押し`;
    };

    machineSelect.onchange = () => {
      setSelectedMachineId(machineSelect.value);
      statusBar.textContent =
        machineSelect.value === "auto"
          ? "自動判定モード"
          : `機種固定: ${machineSelect.selectedOptions[0].textContent}`;
    };

    document.getElementById("pickMachineBtn").onclick = () => {
      machinePanel.classList.toggle("show");
    };

    document.getElementById("saveCustomBtn").onclick = () => {
      const name = document.getElementById("customName").value.trim();
      if (!name) return alert("機種名を入力");
      const entry = saveCustomMachine({
        name,
        first_hit_denom: document.getElementById("customDenom").value || 319,
        ceiling_spins: document.getElementById("customCeiling").value || 840,
        lt_critical: document.getElementById("customLt").checked,
      });
      populateMachineSelect();
      machineSelect.value = entry.id;
      setSelectedMachineId(entry.id);
      machinePanel.classList.remove("show");
      statusBar.textContent = `登録: ${name}`;
    };

    async function startCamera() {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
    }

    async function ensureOcr() {
      if (ocrWorker) return ocrWorker;
      statusBar.textContent = "初回読み込み中…（10MB・1回だけ）";
      const Tesseract = (await import("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js")).default;
      ocrWorker = await Tesseract.createWorker("jpn", 1, {
        logger: () => {},
      });
      statusBar.textContent = "準備OK";
      return ocrWorker;
    }

    function getCropCanvas() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      const rect = frame.getBoundingClientRect();
      const vr = video.getBoundingClientRect();
      const scaleX = vw / vr.width;
      const scaleY = vh / vr.height;

      const sx = (rect.left - vr.left) * scaleX;
      const sy = (rect.top - vr.top) * scaleY;
      const sw = rect.width * scaleX;
      const sh = rect.height * scaleY;

      const maxW = 480;
      const scale = Math.min(1, maxW / sw);
      canvas.width = Math.round(sw * scale);
      canvas.height = Math.round(sh * scale);

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      return canvas;
    }

    function showResult(result, confidence, machineSpec, counterType, data, retreat, ev, nameFeedback) {
      const color = verdictColor(result.verdict);
      frame.style.setProperty("--frame-color", color);

      const badge = document.getElementById("machineNameBadge");
      const fb = nameFeedback || { display: "機種名なし", status: "no_name", statusLabel: "" };
      badge.textContent = `📛 ${fb.display}`;
      badge.className = "none";
      if (fb.status === "db_hit" || fb.status === "manual") badge.className = "hit";
      else if (fb.status === "ocr_only") badge.className = "ocr";
      else if (fb.status === "no_name") badge.className = "none";

      document.getElementById("machineStatus").textContent = fb.statusLabel || "";

      document.getElementById("verdictMain").textContent = `${result.score}点 ${result.verdict}`;
      document.getElementById("verdictMain").style.color = color;

      let sub = "";
      if (machineSpec?.first_hit_denom) sub += `1/${Math.round(machineSpec.first_hit_denom)}`;
      if (ev) sub += ` / ${ev.summary}`;
      if (result.biasApplied) sub += ` / 学習${result.biasApplied > 0 ? "+" : ""}${result.biasApplied}`;
      if (confidence === "low") sub += " ※読み取り不完全";
      document.getElementById("verdictSub").textContent = sub || "—";
      document.getElementById("verdictReasons").textContent = result.reasons.slice(0, 3).join(" / ");

      const evBox = document.getElementById("evBox");
      if (ev) {
        evBox.hidden = false;
        document.getElementById("evSummary").textContent = ev.summary;
        document.getElementById("evLines").innerHTML = [
          `${ev.mode_label || "—"}: 1/${ev.spec_used.denom} 天井${ev.spec_used.ceiling}${ev.spec_used.lt_critical ? " LT重要" : ""}${ev.spec_used.entry_rate != null ? ` 突入${Math.round(ev.spec_used.entry_rate * 100)}%` : ""}`,
          ...ev.factors,
          ev.retreat_hint,
        ].map((l) => `<div>${l}</div>`).join("");
      } else {
        evBox.hidden = true;
      }

      const rb = document.getElementById("retreatBox");
      if (retreat) {
        rb.hidden = false;
        document.getElementById("retreatSummary").textContent = retreat.summary;
        document.getElementById("retreatLines").innerHTML = retreat.lines
          .map((l) => `<div>${l}</div>`)
          .join("");
      } else {
        rb.hidden = true;
      }

      panel.classList.add("show");
      feedbackRow.classList.add("show");
    }

    async function scanOnce() {
      const now = Date.now();
      if (scanning || now - lastScanAt < SCAN_COOLDOWN_MS) return;
      scanning = true;
      lastScanAt = now;
      statusBar.textContent = "読み取り中…";

      try {
        const crop = getCropCanvas();
        if (!crop) throw new Error("カメラ未準備");

        const worker = await ensureOcr();
        const { data: { text } } = await worker.recognize(crop);
        const { data, confidence } = parseOcrText(text);

        if (confidence === "none") {
          statusBar.textContent = "数字が読めません — 下の履歴バーまで枠に入れて";
          panel.classList.remove("show");
          return;
        }

        if (!machineDb) machineDb = await loadMachines(window.location.origin);
        const counterType = detectCounterType(text, machineDb);
        const selectedId = getSelectedMachineId();
        const machineSpec = resolveMachineSpecSync(data, machineDb, selectedId, matchMachine);
        let result = scoreMachine(data, machineSpec);
        const bias = applyLearnedBias(
          result.score,
          machineSpec?.names?.[0],
          counterType?.id,
        );
        if (bias.biasApplied) {
          result = { ...result, score: bias.score };
          if (bias.score >= 65) result.verdict = "打つ候補";
          else if (bias.score < 45) result.verdict = "見送り";
          else result.verdict = "様子見";
          result.biasApplied = bias.biasApplied;
        }
        const ev = calcExpectedValue(data, machineSpec);
        const retreat = calcRetreatPlan(data, machineSpec);
        const nameFeedback = getMachineNameFeedback(
          data.machine_name,
          machineDb,
          machineSpec,
          selectedId,
        );

        lastEntry = {
          machine: machineSpec?.names?.[0],
          counter: counterType?.id,
          score: result.score,
          verdict: result.verdict,
          spins: data.current_spins,
          ev: ev.ev,
        };

        showResult(result, confidence, machineSpec, counterType, data, retreat, ev, nameFeedback);
        statusBar.textContent = `${nameFeedback.display} / ${retreat.summary}`;
      } catch (e) {
        statusBar.textContent = "エラー: " + e.message;
      } finally {
        scanning = false;
      }
    }

    function bindHold(el) {
      const start = (e) => {
        e.preventDefault();
        el.classList.add("active");
        scanOnce();
      };
      const end = () => el.classList.remove("active");
      el.addEventListener("touchstart", start, { passive: false });
      el.addEventListener("touchend", end);
      el.addEventListener("mousedown", start);
      el.addEventListener("mouseup", end);
      el.addEventListener("mouseleave", end);
    }
    bindHold(holdBtn);

    function onFeedback(outcome) {
      if (!lastEntry) return;
      recordFeedback(lastEntry, outcome);
      feedbackRow.classList.remove("show");
      statusBar.textContent =
        outcome === "win"
          ? "記録: 当たった → 次回から補正"
          : outcome === "lose"
            ? "記録: 外れた → 次回から補正"
            : "スキップ";
      lastEntry = null;
    }
    document.getElementById("fbWin").onclick = () => onFeedback("win");
    document.getElementById("fbLose").onclick = () => onFeedback("lose");
    document.getElementById("fbSkip").onclick = () => onFeedback("skip");

    autoBtn.onclick = () => {
      autoMode = !autoMode;
      autoBtn.textContent = `自動: ${autoMode ? "ON" : "OFF"}`;
      autoBtn.classList.toggle("on", autoMode);
      if (autoMode) {
        autoTimer = setInterval(scanOnce, 4000);
        statusBar.textContent = "自動スキャン中（4秒間隔）";
      } else {
        clearInterval(autoTimer);
        statusBar.textContent = "手動モード";
      }
    };

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoMode = false;
        autoBtn.textContent = "自動: OFF";
        autoBtn.classList.remove("on");
      }
    });
  </script>
</body>
</html>
